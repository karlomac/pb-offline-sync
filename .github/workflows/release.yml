name: Release

# Tag-driven: push a SemVer tag (vX.Y.Z) and this does the rest.
#   git tag -a v0.1.0 -m v0.1.0 && git push origin v0.1.0
#
# The changelog section for the version is a hard requirement — see
# docs/release-plan.md. Only the built-in GITHUB_TOKEN is used (no secrets).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # GitHub Release + the server/v* module tag
  packages: write # push the image to GHCR

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      protocol: ${{ steps.v.outputs.protocol }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: v
        name: Check tag and changelog
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "::error::tag ${GITHUB_REF_NAME} is not SemVer (vX.Y.Z)"; exit 1; }
          grep -q "^## \[${version}\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## [${version}]' section"; exit 1; }
          protocol="$(grep -oE '\*\*Protocol version:\*\* [0-9]+' docs/protocol.md | grep -oE '[0-9]+' | head -1)"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "version=$version"
            echo "protocol=${protocol:-unknown}"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version protocol=${protocol:-unknown} prerelease=$prerelease"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: server/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  binaries:
    name: Binary ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: server/go.sum

      - name: Build
        working-directory: server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -eu
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          mkdir -p ../dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/karlomac/pb-offline-sync/server/syncplugin.PluginVersion=${VERSION}" \
            -o "../dist/pb-offline-sync-${GOOS}-${GOARCH}${ext}" ./cmd/pb-offline-sync

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        name: Compute image tags
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY}"
          tags="${image}:${VERSION}\n${image}:sha-${GITHUB_SHA:0:7}"
          if [ "$PRERELEASE" = "false" ]; then
            tags="${tags}\n${image}:${VERSION%.*}\n${image}:latest"
          fi
          printf 'tags<<EOF\n%b\nEOF\n' "$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=pb-offline-sync
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}

  module-tag:
    name: Tag the Go module
    runs-on: ubuntu-latest
    needs: [validate, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Create server/v${{ needs.validate.outputs.version }} if missing
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -eu
          tag="server/v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists"
            exit 0
          fi
          git tag "${tag}"
          git push origin "${tag}"

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, binaries, image, module-tag]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # Only the cross-compiled binaries. Without the pattern this also pulls
          # the `.dockerbuild` record artifact that buildx leaves behind, which
          # fails to download and breaks the release.
          pattern: bin-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS)

      - name: Build release notes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PROTOCOL: ${{ needs.validate.outputs.protocol }}
        run: |
          set -eu
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > NOTES.md
          {
            echo
            echo "---"
            echo
            echo "**Protocol version:** ${PROTOCOL}"
            echo
            echo "- Container image: \`ghcr.io/${GITHUB_REPOSITORY}:${VERSION}\`"
            echo "- Go module: \`go get github.com/karlomac/pb-offline-sync/server@v${VERSION}\`"
            echo "- Deployment (Dokploy, bare metal): see \`README.md\` Parts 1, 3 and 4."
          } >> NOTES.md
          cat NOTES.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -eu
          extra=""
          [ "$PRERELEASE" = "true" ] && extra="--prerelease"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file NOTES.md \
            $extra \
            dist/*

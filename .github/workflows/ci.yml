name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: server (Go ${{ matrix.go }}, PocketBase ${{ matrix.pocketbase }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PocketBase supports the pinned version; widen only after verifying a
        # range against the upstream changelog (see AGENTS.md).
        go: ["1.27.x"]
        pocketbase: ["v0.40.6"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: server/go.sum
      - name: Verify pinned PocketBase matches go.mod
        # go.mod pins the version; this asserts the matrix agrees with it rather
        # than silently rewriting the module graph (repo policy: AGENTS.md).
        run: |
          go get github.com/pocketbase/pocketbase@${{ matrix.pocketbase }}
          git diff --exit-code -- go.mod go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        env:
          GOFLAGS: -mod=mod

  client:
    name: client (${{ matrix.package }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x"]
        package: [core, transport-pocketbase, adapter-expo-sqlite]
    defaults:
      run:
        working-directory: client/${{ matrix.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: client/${{ matrix.package }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level=high

  # Compatibility canary: the pinned version above is authoritative. This job
  # runs the suite against the latest PocketBase to surface upcoming breakage
  # early; it is informational and must not gate merges.
  pocketbase-latest:
    name: compat (PocketBase latest, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: server/go.sum
      - run: go get github.com/pocketbase/pocketbase@latest
      - run: go test ./...
